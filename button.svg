<svg width="300" height="56" viewBox="0 0 300 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#7B5EA7"/>
    </linearGradient>
    <linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="300" height="56" rx="28" fill="url(#g)"/>
  <rect width="300" height="56" rx="28" fill="url(#s)"/>
  <rect width="300" height="56" rx="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="150" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="white" letter-spacing="1">🌐 OPEN WEBTOOLS UTILITY</text>
</svg>
