<svg width="680" height="150" viewBox="0 0 680 150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Open WebTools Utility</title>
  <desc>Cyberpunk animated button — click to open WebTools Utility</desc>
  <defs>
    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,200,150,0)"/>
      <stop offset="50%" stop-color="rgba(0,200,150,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,200,150,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,200,150,0)"/>
      <stop offset="50%" stop-color="rgba(0,200,150,0.07)"/>
      <stop offset="100%" stop-color="rgba(0,200,150,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 -1" to="0 1" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="bc">
      <rect x="115" y="42" width="450" height="56" rx="6"/>
    </clipPath>
  </defs>

  <!-- Outer glow pulse -->
  <rect x="110" y="37" width="460" height="66" rx="8" fill="none" stroke="#00C896" stroke-width="6" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="6;14;6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Button body -->
  <rect x="115" y="42" width="450" height="56" rx="6" fill="#070e0c"/>
  <rect x="115" y="42" width="450" height="56" rx="6" fill="url(#sh)" clip-path="url(#bc)"/>
  <rect x="115" y="42" width="450" height="56" rx="6" fill="url(#sl)" clip-path="url(#bc)"/>

  <!-- Main border -->
  <rect x="115" y="42" width="450" height="56" rx="6" fill="none" stroke="#00C896" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Cut corner fills -->
  <polygon points="115,52 125,42 135,42" fill="#00C896" opacity="0.15"/>
  <polygon points="565,52 555,42 545,42" fill="#00C896" opacity="0.15"/>
  <polygon points="115,88 125,98 135,98" fill="#00C896" opacity="0.15"/>
  <polygon points="565,88 555,98 545,98" fill="#00C896" opacity="0.15"/>

  <!-- L-brackets TL -->
  <path d="M118 58 L118 45 L131 45" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="square">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="0s"/>
  </path>
  <!-- TR -->
  <path d="M562 58 L562 45 L549 45" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="square">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0s"/>
  </path>
  <!-- BL -->
  <path d="M118 82 L118 95 L131 95" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="square">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  <!-- BR -->
  <path d="M562 82 L562 95 L549 95" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="square">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>

  <!-- Side dashes left -->
  <line x1="115" y1="64" x2="115" y2="68" stroke="#00C896" stroke-width="2">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <line x1="115" y1="72" x2="115" y2="76" stroke="#00C896" stroke-width="2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
  </line>
  <!-- Side dashes right -->
  <line x1="565" y1="64" x2="565" y2="68" stroke="#00C896" stroke-width="2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </line>
  <line x1="565" y1="72" x2="565" y2="76" stroke="#00C896" stroke-width="2">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
  </line>

  <!-- Floating particles -->
  <circle cx="148" cy="70" r="2" fill="#00C896">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="532" cy="70" r="2" fill="#00C896">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="60;80;60" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="160" cy="70" r="1.2" fill="#00C896" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
  <circle cx="520" cy="70" r="1.2" fill="#00C896" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- Horizontal scan line -->
  <line x1="115" y1="70" x2="565" y2="70" stroke="#00C896" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.12;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="44;98;44" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="44;98;44" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Left status labels -->
  <text x="130" y="67" font-family="monospace" font-size="8" fill="#00C896" opacity="0.4" letter-spacing="1">SYS</text>
  <text x="130" y="77" font-family="monospace" font-size="8" fill="#00C896" letter-spacing="1">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.8s" repeatCount="indefinite"/>
    ON
  </text>

  <!-- Right status labels -->
  <text x="536" y="67" font-family="monospace" font-size="8" fill="#00C896" opacity="0.4" letter-spacing="1">v1.0</text>
  <text x="536" y="77" font-family="monospace" font-size="8" fill="#00C896" opacity="0.5" letter-spacing="1">P2P</text>

  <!-- Main text -->
  <text x="340" y="75" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#00C896" letter-spacing="3">
    ⬡ OPEN WEBTOOLS UTILITY ⬡
    <animate attributeName="opacity" values="1;0.88;1" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom tagline fade in/out -->
  <text x="340" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#00C896" opacity="0" letter-spacing="2">
    ◈ ZERO UPLOADS · ZERO TRACKING · OPEN SOURCE ◈
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="5s" repeatCount="indefinite" begin="1s"/>
  </text>

  <!-- Top tagline fade in/out -->
  <text x="340" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#00C896" opacity="0" letter-spacing="2">
    ◈ BROWSER-BASED FILE TOOLKIT ◈
    <animate attributeName="opacity" values="0.45;0.45;0;0;0.45" dur="5s" repeatCount="indefinite" begin="0s"/>
  </text>

</svg>
